[workspace]
resolver = "2"
members = ["crates/petweave-core", "crates/petweave"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
description = "PetWeave — a Wayland desktop pet framework"

[workspace.dependencies]
petweave-core = { path = "crates/petweave-core" }
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.13"
wayland-protocols-wlr = "0.3.11"
smithay-client-toolkit = "0.20.0"
calloop = { version = "0.14.4", features = ["signals"] }
calloop-wayland-source = "0.4.1"
nix = { version = "0.31.2", features = ["fs", "poll", "signal", "inotify"] }
libc = "0.2.189"
sysinfo = "0.33.1"
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }
walkdir = "2.5.0"
tempfile = "3.27.0"
mlua = { version = "0.11.5", features = ["lua54", "vendored", "send"] }
resvg = "0.45.1"
ab_glyph = "0.2.32"
tiny-skia = "0.11.4"

# Release hardening: LTO, panic=abort, stripped, single codegen unit.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
